<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ · AI_VI</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body data-page="login" class="login-page">
  <main class="login-card">
    <p class="eyebrow">Personal Investment Intelligence</p>
    <h1>AI_VI</h1>
    <p class="muted">เข้าสู่ระบบเพื่อเปิดคลังวิจัยส่วนตัว</p>
    <form id="login-form">
      <label>Username<input name="username" autocomplete="username" value="admin" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required autofocus></label>
      <button type="submit">เข้าสู่ระบบ</button>
    </form>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
