[project]
name = "aivi"
version = "0.1.0"
description = "Personal investment research system for fundamental analysis."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pydantic>=2.10",
  "pypdf>=5.1",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aivi = ["api/*.html", "api/*.css", "api/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
